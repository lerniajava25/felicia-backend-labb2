<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(|${ticket.title} · Helpdesk|)}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main>
    <p>
        <a th:href="@{/tickets}">← My tickets</a>
        <a sec:authorize="hasRole('AGENT')" th:href="@{/agent/tickets}">← All tickets</a>
    </p>

    <!-- Flash messages: set before a redirect, shown once, then gone. -->
    <p th:if="${message}" class="msg msg-info" role="status" th:text="${message}">Done</p>
    <p th:if="${error}" class="msg msg-error" role="alert" th:text="${error}">Error</p>

    <article class="ticket">
        <h1 th:text="${ticket.title}">Title</h1>

        <dl class="ticket-meta">
            <dt>Status</dt>
            <!-- IN_PROGRESS becomes "status status-in-progress", same as the list -->
            <dd th:with="slug=${ticket.status.name().toLowerCase().replace('_', '-')}"
                th:class="${'status status-' + slug}"
                th:text="${ticket.status}">NEW</dd>
            <dt>Created by</dt>
            <dd th:text="${ticket.createdBy}">Name</dd>
            <dt>Assigned to</dt>
            <dd th:if="${ticket.assignee != null}" th:text="${ticket.assignee}">Name</dd>
            <dd th:unless="${ticket.assignee != null}" class="ticket-unassigned">Not assigned</dd>
            <dt>Created</dt>
            <dd th:text="${ticket.created}">2026-01-01 12:00</dd>
            <dt>Last changed</dt>
            <dd th:text="${ticket.lastModified}">2026-01-01 12:00</dd>
        </dl>

        <!-- Only hides the button. The /agent/** URL rule and @PreAuthorize do the real check.
             The version lets the server notice if someone changed the ticket meanwhile. -->
        <th:block sec:authorize="hasRole('AGENT')">
            <form th:unless="${ticket.status.name() == 'CLOSED'}"
                  th:action="@{/agent/tickets/{id}/assign(id=${ticket.id})}" method="post" class="assign-form">
                <input type="hidden" name="version" th:value="${ticket.version}">
                <button type="submit" class="btn btn-secondary">Assign to me</button>
            </form>

            <!-- Only the moves TicketStatus.canMoveTo allows; the service checks them again.
                 No form at all when nothing is allowed (a CLOSED ticket). -->
            <form th:unless="${ticket.allowedMoves.isEmpty()}"
                  th:action="@{/agent/tickets/{id}/status(id=${ticket.id})}" method="post" class="status-form">
                <input type="hidden" name="version" th:value="${ticket.version}">
                <label for="status">New status</label>
                <select id="status" name="status">
                    <option th:each="move : ${ticket.allowedMoves}"
                            th:value="${move.name()}" th:text="${move.label()}">In progress</option>
                </select>
                <!-- Only a NEW ticket needs a reason to be closed. Not "required": In progress
                     needs none. The service checks it. -->
                <th:block th:if="${ticket.status.name() == 'NEW'}">
                    <label for="reason">Reason (needed to close)</label>
                    <textarea id="reason" name="reason" rows="2"></textarea>
                </th:block>
                <button type="submit" class="btn btn-secondary">Change status</button>
            </form>
        </th:block>

        <!-- white-space: pre-line in app.css keeps the user's line breaks -->
        <p class="ticket-description" th:text="${ticket.description}">Description</p>
    </article>

    <section class="ticket-comments">
        <h2>Comments</h2>
        <p th:if="${ticket.comments.isEmpty()}">No comments yet.</p>
        <ol th:unless="${ticket.comments.isEmpty()}" class="comment-list">
            <li th:each="comment : ${ticket.comments}" class="comment">
                <p class="comment-header">
                    <strong th:text="${comment.author}">Name</strong>
                    <span class="comment-time" th:text="${comment.created}">2026-01-01 12:00</span>
                </p>
                <p class="comment-body" th:text="${comment.body}">Comment</p>
            </li>
        </ol>

        <!-- th:action adds the hidden CSRF token. No maxlength: browsers count a line
             break as 1 character but send 2 (\r\n); the server checks the length. -->
        <form th:action="@{/tickets/{id}/comments(id=${ticket.id})}" th:object="${commentForm}"
              method="post" class="card form-card comment-form">
            <div class="field">
                <label for="body">Add a comment</label>
                <textarea th:field="*{body}" rows="4" required
                          th:aria-invalid="${#fields.hasErrors('body')} ? 'true'"
                          th:aria-describedby="${#fields.hasErrors('body')} ? 'body-error'"></textarea>
                <p id="body-error" class="field-error"
                   th:if="${#fields.hasErrors('body')}" th:errors="*{body}">Error</p>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add comment</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
